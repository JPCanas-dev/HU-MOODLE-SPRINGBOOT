<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo - Eventify</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        .btn { padding: 10px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; display: inline-block; margin-bottom: 20px; }
        .btn:hover { background-color: #0056b3; }
        .alert { padding: 15px; background-color: #f8d7da; color: #721c24; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

<h1>Catálogo de Eventos</h1>

<!-- Botón para ir al formulario de creación -->
<a th:href="@{/admin/events/new}" class="btn">Crear Nuevo Evento</a>

<!-- ESCENARIO 2: Mensaje de inventario vacío (th:if evalúa si la lista está vacía) -->
<div th:if="${events.empty}" class="alert">
    Actualmente no hay eventos programados.
</div>

<!-- ESCENARIO 1: Tabla de eventos (th:unless se ejecuta si la lista NO está vacía) -->
<table th:unless="${events.empty}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Lugar</th>
        <th>Fecha</th>
    </tr>
    </thead>
    <tbody>
    <!-- th:each itera sobre la variable 'events' enviada desde Java con los atributos reales de Event.java -->
    <tr th:each="event : ${events}">
        <td th:text="${event.id}"></td>
        <td th:text="${event.name}"></td>
        <td th:text="${event.description}"></td>
        <td th:text="${event.venue}"></td>
        <td th:text="${event.date}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
