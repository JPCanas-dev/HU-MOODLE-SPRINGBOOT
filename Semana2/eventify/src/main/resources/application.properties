# Persistencia local en archivo (sobrevive a reinicios)
spring.datasource.url=jdbc:h2:file:./data/eventifyDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate actualizará las tablas automáticamente basado en tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true